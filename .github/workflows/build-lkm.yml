name: Build All GKI
on:
  push:
    paths:
      - 'lib/**'
      - 'src/**'
      - 'Makefile'
      - '.github/workflows/build-lkm.yml'
  workflow_dispatch:

jobs:
  build-matrix:
    strategy:
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260313
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Fetch deps
        run: |
          git clone https://github.com/Dere3046/HooKern.git deps/LKMhook
          git -C deps/LKMhook checkout 6f7bd8132d15e4f15e76e926a126141278126392
          git clone https://github.com/Dere3046/KallRecon.git deps/KallRecon
          git -C deps/KallRecon checkout 63163fd477897fad97639f5ebca77af655499add
      - name: Build
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: hbd-${{ matrix.kmi }}
          path: out/hbd.ko
